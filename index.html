<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eclipse Chronicles</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style/style.css">
    <style>
        body {
            background-color: #121212;
            color: white;
            padding: 20px;
        }

        #scene-img {
            max-width: 100%;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        #dialogue-text p {
            font-size: 1.2rem;
        }

        #options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .stat-display {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            padding: 10px;
            background-color: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
        }

        #player-name-input {
            display: block;
        }

        .save-load-container {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        #saveBtn,
        #loadBtn,
        #newGameBtn {
            font-size: 1.2rem;
        }

        #unmuteBtn {
            position: fixed;
            bottom: 10px;
            right: 10px;
            font-size: 1.5rem;
        }

        audio {
            display: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1 class="text-center mb-4">Eclipse Chronicles</h1>

        <div class="row">
            <div class="col-md-6 offset-md-3">
                <img id="scene-img" src="" alt="Scene Image" class="img-fluid">
                <div id="dialogue-text" class="mb-4"></div>

                <div id="player-name-input" class="mb-3">
                    <input type="text" id="player-name" class="form-control" placeholder="Masukkan nama karakter">
                    <button class="btn btn-primary mt-2" onclick="startGame()">Mulai Game</button>
                </div>

                <div id="options"></div>
            </div>
        </div>
    </div>

    <div id="save-load-buttons" class="save-load-container">
        <button id="saveBtn" class="btn btn-secondary">💾 Save</button>
        <button id="loadBtn" class="btn btn-secondary">🔃 Load</button>
        <button id="newGameBtn" class="btn btn-danger">🔄 New Game</button>
    </div>

    <button id="unmuteBtn">
        🔇 Unmute
    </button>

    <audio id="bgMusic" loop>
        <source src="music/dark_fantasy.mp3" type="audio/mpeg">
        Browser Anda tidak mendukung audio HTML5
    </audio>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/game.js"></script>
</body>

</html>
